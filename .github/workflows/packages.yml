name: packages
# Rebuilds the signed apt and dnf/zypper repositories from the .deb and .rpm files of the last two releases and
# publishes them on GitHub Pages: sudo apt install routengine, dnf install routengine, zypper install routengine.
# Needs the secret APT_GPG_PRIVATE_KEY (the armored private signing key) and Pages set to "GitHub Actions".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  repos:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils createrepo-c gnupg
      - name: Import the signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          test -n "$APT_GPG_PRIVATE_KEY" || { echo "secret APT_GPG_PRIVATE_KEY is not set"; exit 1; }
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Collect the packages of the last two releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir pkgs
          # two, not all: a Pages site may not pass 1 GB
          for tag in $(gh release list --limit 2 --json tagName -q '.[].tagName'); do
            gh release download "$tag" --pattern '*.deb' --pattern '*.rpm' --dir pkgs --skip-existing
          done
          ls pkgs
      - name: Build the repositories
        env:
          REPO_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          scripts/build-repos.sh pkgs site
          du -sh site
          test "$(du -sm site | cut -f1)" -lt 900 || { echo "site is too big for GitHub Pages"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
